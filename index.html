
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mochi | Cloud Pet Card</title>

    <!-- Connect our prepared stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Choose a theme: pink, lavender, mint, blue, peach -->
    <main class="pet-card pink">

        <!-- Card header -->
        <header class="card-header">
            <span>☁ Cloud Pet Club</span>
            <span>No. 001</span>
        </header>

        <!-- Customize your pet's appearance -->
        <div class="pet-avatar">
            <span role="img" aria-label="Cat">🐱</span>
        </div>

        <!-- Customize your pet's identity -->
        <h1>Mochi</h1>

        <p class="pet-type">✦ Cloud Cat ✦</p>

        <!-- Write a short description -->
        <p class="description">
            A tiny cloud traveler who loves
            strawberries and afternoon naps.
        </p>

        <!-- Pet information -->
        <section class="details" aria-label="Pet information">

            <div class="detail">
                <span class="detail-icon">💗</span>
                <div>
                    <h2>Personality</h2>
                    <p>Sleepy & sweet</p>
                </div>
            </div>

            <div class="detail">
                <span class="detail-icon">🍓</span>
                <div>
                    <h2>Favorite Food</h2>
                    <p>Strawberries</p>
                </div>
            </div>

            <div class="detail">
                <span class="detail-icon">✨</span>
                <div>
                    <h2>Special Ability</h2>
                    <p>Dream Magic</p>
                </div>
            </div>

        </section>

    </main>

</body>
</html>
